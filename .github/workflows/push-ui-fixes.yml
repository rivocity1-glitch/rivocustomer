name: Push customer UI fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/all-customer
          fetch-depth: 0
      - name: Apply fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Product gallery: support image_url containing a JSON array of URLs, while preserving single URL compatibility.
          p=Path('src/app/product/[id].tsx')
          s=p.read_text()
          if 'function parseProductImages' not in s:
              s=s.replace("const { width } = Dimensions.get('window');", "const { width } = Dimensions.get('window');\n\nfunction parseProductImages(value: unknown): string[] {\n  if (!value) return [];\n  if (Array.isArray(value)) return value.filter((v): v is string => typeof v === 'string' && !!v);\n  if (typeof value !== 'string') return [];\n  try { const parsed=JSON.parse(value); if (Array.isArray(parsed)) return parsed.filter((v): v is string => typeof v === 'string' && !!v); } catch {}\n  return [value];\n}")
          if 'const [imageIndex' not in s:
              s=s.replace("const [isInCart, setIsInCart] = useState<boolean>(false);", "const [isInCart, setIsInCart] = useState<boolean>(false);\n  const [imageIndex, setImageIndex] = useState(0);")
          marker=re.search(r'(?s)        /\*\* IMAGE DISPLAY CONTAINER \*/.*?        </View>',s)
          if marker and 'PRODUCT IMAGE GALLERY' not in s:
              old=marker.group(0)
              new='''        {/* PRODUCT IMAGE GALLERY */}
        <View style={styles.imageContainer}>
          {(() => {
            const images = parseProductImages(product.image_url);
            if (!images.length) {
              return <View style={styles.fallbackGraphic}><Text style={styles.fallbackLetter}>{product.name?.charAt(0).toUpperCase() || 'P'}</Text></View>;
            }
            return <>
              <ScrollView
                horizontal
                pagingEnabled
                showsHorizontalScrollIndicator={false}
                style={styles.imageGalleryScroll}
                onMomentumScrollEnd={event => setImageIndex(Math.round(event.nativeEvent.contentOffset.x / width))}
              >
                {images.map((imageUrl, index) => (
                  <View key={`${imageUrl}-${index}`} style={styles.imageSlide}>
                    <Image source={{ uri: imageUrl }} style={styles.productImage} resizeMode="contain" />
                  </View>
                ))}
              </ScrollView>
              {images.length > 1 && (
                <View style={styles.imageDotsRow}>
                  {images.map((_, index) => <View key={index} style={[styles.imageDot, index === imageIndex && styles.imageDotActive]} />)}
                </View>
              )}
            </>;
          })()}
        </View>'''
              s=s.replace(old,new)
          if 'imageGalleryScroll:' not in s:
              s=s.replace("  productImage: {\n    width: '85%',\n    height: '85%',\n  },", "  imageGalleryScroll: { width: '100%', height: '100%' },\n  imageSlide: { width, height: 300, alignItems: 'center', justifyContent: 'center' },\n  productImage: { width: '85%', height: '85%' },\n  imageDotsRow: { position: 'absolute', bottom: 12, left: 0, right: 0, flexDirection: 'row', justifyContent: 'center', alignItems: 'center', gap: 6 },\n  imageDot: { width: 6, height: 6, borderRadius: 3, backgroundColor: '#CBD5E1' },\n  imageDotActive: { width: 18, backgroundColor: '#22CC71' },")
          # Store banner sizing: 8:3 container for the approved 1600x600 artwork.
          p=Path('src/app/store/[id].tsx'); s=p.read_text()
          if 'const BANNER_ASPECT_RATIO' not in s:
              s=s.replace("const { width: SCREEN_WIDTH } = Dimensions.get('window');", "const { width: SCREEN_WIDTH } = Dimensions.get('window');\nconst BANNER_ASPECT_RATIO = 8 / 3;\nconst BANNER_HEIGHT = SCREEN_WIDTH / BANNER_ASPECT_RATIO;")
          if 'const CARD_WIDTH' in s and s.count('BANNER_HEIGHT') == 1:
              pass
          s=s.replace('height: 220,', 'height: BANNER_HEIGHT,', 1)
          s=s.replace('height: 180,', 'height: BANNER_HEIGHT,', 1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "src/app/product/[id].tsx" "src/app/store/[id].tsx"
          git commit -m "Fix customer banners and product image gallery" || exit 0
          git push origin test/all-customer
