name: Apply UI fixes
on:
  push:
    branches: [test/all-customer]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/all-customer
          fetch-depth: 0
      - name: Patch customer UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p=Path('src/app/product/[id].tsx')
          s=p.read_text()
          if 'function parseProductImages' not in s:
            s=s.replace("const { width } = Dimensions.get('window');", "const { width } = Dimensions.get('window');\n\nfunction parseProductImages(value: unknown): string[] {\n  if (!value) return [];\n  if (Array.isArray(value)) return value.filter((item): item is string => typeof item === 'string' && !!item);\n  if (typeof value !== 'string') return [];\n  try { const parsed = JSON.parse(value); if (Array.isArray(parsed)) return parsed.filter((item): item is string => typeof item === 'string' && !!item); } catch {}\n  return [value];\n}")
          s=s.replace("const [isInCart, setIsInCart] = useState<boolean>(false);", "const [isInCart, setIsInCart] = useState<boolean>(false);\n  const [imageIndex, setImageIndex] = useState(0);")
          old='''        {/* IMAGE DISPLAY CONTAINER */}\n        <View style={styles.imageContainer}>\n          {product.image_url ? (\n            <Image source={{ uri: product.image_url }} style={styles.productImage} resizeMode="contain" />\n          ) : (\n            <View style={styles.fallbackGraphic}>\n              <Text style={styles.fallbackLetter}>{product.name?.charAt(0).toUpperCase() || 'P'}</Text>\n            </View>\n          )}\n        </View>'''
          new='''        {/* PRODUCT IMAGE GALLERY */}\n        <View style={styles.imageContainer}>\n          {(() => {\n            const images = parseProductImages(product.image_url);\n            if (!images.length) {\n              return <View style={styles.fallbackGraphic}><Text style={styles.fallbackLetter}>{product.name?.charAt(0).toUpperCase() || 'P'}</Text></View>;\n            }\n            return <>\n              <ScrollView horizontal pagingEnabled showsHorizontalScrollIndicator={false} style={styles.imageGalleryScroll} onMomentumScrollEnd={event => setImageIndex(Math.round(event.nativeEvent.contentOffset.x / width))}>\n                {images.map((imageUrl, index) => <View key={`${imageUrl}-${index}`} style={styles.imageSlide}><Image source={{ uri: imageUrl }} style={styles.productImage} resizeMode="contain" /></View>)}\n              </ScrollView>\n              {images.length > 1 && <View style={styles.imageDotsRow}>{images.map((_, index) => <View key={index} style={[styles.imageDot, index === imageIndex && styles.imageDotActive]} />)}</View>}\n            </>;\n          })()}\n        </View>'''
          if old not in s: raise SystemExit('customer product image block not found')
          s=s.replace(old,new)
          s=s.replace("  productImage: {\n    width: '85%',\n    height: '85%',\n  },", "  imageGalleryScroll: { width: '100%', height: '100%' },\n  imageSlide: { width, height: 300, alignItems: 'center', justifyContent: 'center' },\n  productImage: { width: '85%', height: '85%' },\n  imageDotsRow: { position: 'absolute', bottom: 12, left: 0, right: 0, flexDirection: 'row', justifyContent: 'center', alignItems: 'center', gap: 6 },\n  imageDot: { width: 6, height: 6, borderRadius: 3, backgroundColor: '#CBD5E1' },\n  imageDotActive: { width: 18, backgroundColor: '#22CC71' },")
          p.write_text(s)

          p=Path('src/app/store/[id].tsx')
          s=p.read_text()
          s=s.replace('height: BANNER_HEIGHT,', 'height: BANNER_HEIGHT,\n      aspectRatio: BANNER_ASPECT_RATIO,', 1)
          # Existing banner code already uses 8:3; ensure product cards tolerate JSON image_url values.
          s=s.replace('uri: item.image_url', 'uri: getPrimaryProductImage(item.image_url) || \'\'')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "src/app/product/[id].tsx" "src/app/store/[id].tsx"
          git commit -m "Fix customer banner layout and product gallery"
          git push origin test/all-customer
